<main>

<section>

    <h2>Send Me a Message</h2>

    <form action="https://formspree.io/f/YOUR_FORM_ID"
          method="POST">

        <label for="name">Name:</label>

        <input type="text"
               id="name"
               name="name"
               required>

        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email"
               required>

        <label for="message">Message:</label>

        <textarea id="message"
                  name="message"
                  rows="6"
                  required></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>
