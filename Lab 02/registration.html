<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Student Registration Form</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">About</a>
        <a href="schedule.html">Schedule</a>
        <a href="navigation.html">Courses</a>
        <a href="registration.html">Registration</a>
    </nav>
</header>

<main>

<form action="#" method="post">

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="regno">Registration Number:</label>
    <input type="text" id="regno" name="regno" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="course">Select Course:</label>

    <select id="course" name="course">
        <option value="data-science">Data Science</option>
        <option value="web-technologies">Web Technologies</option>
        <option value="data-mining">Data Mining</option>
        <option value="machine-learning">Machine Learning</option>
    </select>

    <p>Select Semester:</p>

    <label>
        <input type="radio" name="semester" value="1">
        1st Semester
    </label>

    <label>
        <input type="radio" name="semester" value="2">
        2nd Semester
    </label>

    <label>
        <input type="radio" name="semester" value="3">
        3rd Semester
    </label>

    <label>
        <input type="radio" name="semester" value="4">
        4th Semester
    </label>

    <label>
        <input type="checkbox" name="terms" required>
        I agree to the terms and conditions.
    </label>

    <button type="submit">Register</button>

</form>

</main>

<footer>
    <p>&copy; 2026 Shayan Yousafzai</p>
</footer>

</body>
</html>
